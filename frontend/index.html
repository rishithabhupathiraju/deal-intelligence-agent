<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal Intelligence Agent</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 22px 40px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 6px;
            color: #cbd5e1;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-box {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .search-box h2 {
            margin-bottom: 15px;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .loading {
            display: none;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
        }

        .dashboard {
            display: none;
        }

        .company-title {
            margin-bottom: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .card h3 {
            margin-bottom: 12px;
            font-size: 17px;
        }

        .card p {
            line-height: 1.6;
            color: #4b5563;
        }

        .action {
            grid-column: span 2;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .action p {
            color: #1e40af;
            font-weight: bold;
        }

        .memory {
            margin-top: 25px;
            background: #111827;
            color: #e5e7eb;
            padding: 22px;
            border-radius: 14px;
        }

        .memory h3 {
            margin-bottom: 12px;
        }

        .memory pre {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .input-row {
                flex-direction: column;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .action {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🧠 Deal Intelligence Agent</h1>
    <p>AI-powered sales intelligence with persistent Hindsight memory</p>
</header>

<div class="container">

    <div class="search-box">
        <h2>Prepare for a Deal</h2>

        <div class="input-row">
            <input
                type="text"
                id="company"
                placeholder="Enter company name"
                value="Acme Technologies"
            >

            <button onclick="getBriefing()">
                Prepare for Call
            </button>
        </div>
    </div>

    <div class="loading" id="loading">
        🧠 Recalling deal history...
    </div>

    <div class="dashboard" id="dashboard">

        <div class="company-title">
            <h2 id="companyName"></h2>
            <p>AI-generated deal intelligence</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>⚠️ Customer Concerns</h3>
                <p id="concerns"></p>
            </div>

            <div class="card">
                <h3>🏆 Competitors</h3>
                <p id="competitors"></p>
            </div>

            <div class="card">
                <h3>🔧 Important Requirements</h3>
                <p id="requirements"></p>
            </div>

            <div class="card">
                <h3>🚨 Key Risks</h3>
                <p id="risks"></p>
            </div>

            <div class="card action">
                <h3>🎯 Recommended Next Action</h3>
                <p id="nextAction"></p>
            </div>

        </div>

        <div class="memory">
            <h3>🧠 Hindsight Memory</h3>
            <pre id="memory"></pre>
        </div>

    </div>

</div>

<script>

async function getBriefing() {

    const company = document.getElementById("company").value.trim();

    if (!company) {
        alert("Please enter a company name.");
        return;
    }

    const loading = document.getElementById("loading");
    const dashboard = document.getElementById("dashboard");

    loading.style.display = "block";
    dashboard.style.display = "none";

    try {

        const response = await fetch(
            `/deals/${encodeURIComponent(company)}/briefing`
        );

        const data = await response.json();

        if (data.error) {
            alert(data.error);
            return;
        }

        document.getElementById("companyName").textContent =
            data.company;

        document.getElementById("concerns").textContent =
            data.deal_briefing.customer_concerns;

        document.getElementById("competitors").textContent =
            data.deal_briefing.competitors;

        document.getElementById("requirements").textContent =
            data.deal_briefing.important_requirements;

        document.getElementById("risks").textContent =
            data.deal_briefing.key_risks;

        document.getElementById("nextAction").textContent =
            data.deal_briefing.recommended_next_action;

        document.getElementById("memory").textContent =
            JSON.stringify(
                data.deal_briefing.hindsight_memory,
                null,
                2
            );

        dashboard.style.display = "block";

    } catch (error) {

        alert("Could not connect to the backend.");

    } finally {

        loading.style.display = "none";
    }
}

</script>

</body>
</html>
